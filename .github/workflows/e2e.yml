name: E2E idempotency suite

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - "nginx/**"
      - "reconciliation-db/**"
      - "tests/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "services/**"
      - "infra/**"
      - "nginx/**"
      - "reconciliation-db/**"
      - "tests/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/e2e.yml"
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run the stack + e2e suite
        run: make test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
